apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: event-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: event-frontend:IMAGE_TAG
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: event-app
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
